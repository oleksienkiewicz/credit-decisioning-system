services:
  db:
    image: postgres:17
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  model_service:
    build:
      context: .
      dockerfile: model_service/Dockerfile
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: db
      MODEL_SERVICE_URL: http://model_service:8000
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy
      model_service:
        condition: service_started

volumes:
  pgdata: